<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Timer & Quiz Maker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 820px; margin: 0 auto; display: grid; gap: 1.5rem; }

    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.2rem; margin-bottom: 1rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }

    input, select, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.85rem;
      font-size: 0.95rem;
    }

    input, select { background: var(--bg); color: var(--text); width: 100%; }
    button {
      background: var(--accent);
      color: #082f49;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); color: #fff; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }
    button.danger { background: var(--danger); color: #fff; }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 700;
      text-align: center;
      margin: 1rem 0;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .status { font-size: 0.9rem; color: var(--muted); text-align: center; margin-bottom: 0.75rem; }

    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }
    .quiz-option:hover { border-color: var(--accent); background: var(--bg); color: var(--text); }
    .quiz-option.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.15); }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    .question-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .question-item:last-child { border-bottom: none; }
    .badge { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study Timer &amp; Quiz Maker</h1>
      <button id="notifyBtn" class="secondary" type="button">Enable Notifications</button>
    </header>

    <!-- Study Timer Section -->
    <section class="card">
      <h2>Study Timer</h2>
      <div class="row">
        <label class="badge" for="minutesInput">Minutes:</label>
        <input id="minutesInput" type="number" min="1" max="240" value="25" style="max-width: 110px;" />
        <button id="setTimerBtn" class="secondary" type="button">Set Time</button>
        <button id="startPauseBtn" type="button">Start</button>
        <button id="resetBtn" class="secondary" type="button">Reset</button>
      </div>
      <div id="timerDisplay" class="timer-display">25:00</div>
      <div id="timerStatus" class="status">Ready to study</div>
    </section>

    <!-- Take Quiz Section -->
    <section class="card">
      <div class="row" style="justify-content: space-between; margin-bottom: 1rem;">
        <h2 style="margin: 0;">Self-Test Quiz</h2>
        <span id="scoreDisplay" class="badge">Score: 0 / 0</span>
      </div>
      <div id="quizArea"></div>
      <div class="row" style="margin-top: 1rem;">
        <button id="nextQuestionBtn" class="secondary" type="button">Next Question</button>
        <button id="resetScoreBtn" class="secondary" type="button">Reset Score</button>
      </div>
    </section>

    <!-- Create Quiz Questions Section -->
    <section class="card">
      <h2>Create a Quiz Question</h2>
      <form id="questionForm" style="display: grid; gap: 0.75rem;">
        <input id="qText" type="text" placeholder="Question (e.g., What does HTTP stand for?)" required />
        <div class="grid-2">
          <input id="opt0" type="text" placeholder="Option 1" required />
          <input id="opt1" type="text" placeholder="Option 2" required />
          <input id="opt2" type="text" placeholder="Option 3" required />
          <input id="opt3" type="text" placeholder="Option 4" required />
        </div>
        <div class="row">
          <label class="badge" for="correctIndex">Correct Option:</label>
          <select id="correctIndex" style="max-width: 180px;">
            <option value="0">Option 1</option>
            <option value="1">Option 2</option>
            <option value="2">Option 3</option>
            <option value="3">Option 4</option>
          </select>
          <button type="submit">Add Question</button>
        </div>
      </form>

      <div id="questionList" style="margin-top: 1.25rem;"></div>
    </section>
  </div>

  <script>
    // --- Study Timer & Notifications ---
    let totalSeconds = 25 * 60;
    let remainingSeconds = totalSeconds;
    let intervalId = null;

    const timerDisplay = document.getElementById("timerDisplay");
    const timerStatus = document.getElementById("timerStatus");
    const minutesInput = document.getElementById("minutesInput");
    const startPauseBtn = document.getElementById("startPauseBtn");
    const notifyBtn = document.getElementById("notifyBtn");

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function updateTimerUI() {
      timerDisplay.textContent = formatTime(remainingSeconds);
      document.title = `${formatTime(remainingSeconds)} - Study Timer`;
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (_) {}
    }

    function sendNotification(title, body) {
      playBeep();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body });
      }
    }

    function updateNotifyButton() {
      if (!("Notification" in window)) {
        notifyBtn.textContent = "Notifications Unsupported";
        notifyBtn.disabled = true;
        return;
      }
      if (Notification.permission === "granted") {
        notifyBtn.textContent = "Notifications Enabled";
      } else if (Notification.permission === "denied") {
        notifyBtn.textContent = "Notifications Blocked";
      } else {
        notifyBtn.textContent = "Enable Notifications";
      }
    }

    notifyBtn.addEventListener("click", async () => {
      if (!("Notification" in window)) return;
      await Notification.requestPermission();
      updateNotifyButton();
    });

    document.getElementById("setTimerBtn").addEventListener("click", () => {
      const mins = Math.max(1, Math.min(240, Number(minutesInput.value) || 25));
      minutesInput.value = mins;
      clearInterval(intervalId);
      intervalId = null;
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      startPauseBtn.textContent = "Start";
      timerStatus.textContent = `Timer set to ${mins} minute(s)`;
      updateTimerUI();
    });

    startPauseBtn.addEventListener("click", () => {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
        startPauseBtn.textContent = "Resume";
        timerStatus.textContent = "Paused";
        return;
      }

      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      startPauseBtn.textContent = "Pause";
      timerStatus.textContent = "Studying...";

      intervalId = setInterval(() => {
        remainingSeconds--;
        updateTimerUI();

        if (remainingSeconds <= 0) {
          clearInterval(intervalId);
          intervalId = null;
          startPauseBtn.textContent = "Start";
          timerStatus.textContent = "Time's up! Take a break or test yourself.";
          sendNotification("Study Session Complete", "Your timer finished. Time for a break or a quick quiz!");
        }
      }, 1000);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      clearInterval(intervalId);
      intervalId = null;
      remainingSeconds = totalSeconds;
      startPauseBtn.textContent = "Start";
      timerStatus.textContent = "Timer reset";
      updateTimerUI();
    });

    // --- Quiz Builder & Self-Test ---
    const STORAGE_KEY = "study_quiz_questions_v1";
    const defaultQuestions = [
      {
        question: "Which array method creates a new array with elements that pass a test?",
        options: ["map()", "filter()", "forEach()", "reduce()"],
        correct: 1
      },
      {
        question: "Which browser API stores key-value pairs with no expiration date?",
